# ──────────────────────────────────────────────────────────────────────────
# STELLAR SCREENER — 日次フォワードテスト追跡（株価更新・成績評価）
#
# 毎平日 17:30 JST (= 08:30 UTC) に Supabase (DATABASE_URL) 上の
# signal_tracks を評価し、現在株価・horizon 成績・10営業日確定を更新します。
#
# 必須シークレット:
#   DATABASE_URL — Supabase PostgreSQL 接続 URI（Render 本番と同じ値で可）
#
# 任意:
#   SUPABASE_POOLER_REGION — pooler リージョン（既定: ap-northeast-1）
#   GitHub Actions では IPv4 の session pooler へ自動変換されます
# ──────────────────────────────────────────────────────────────────────────

name: 📊 Daily Tracking Evaluation (17:30 JST)

on:
  schedule:
    # 毎平日 08:30 UTC = 17:30 JST（大引け後）
    - cron: "30 8 * * 1-5"

  workflow_dispatch:

jobs:
  evaluate-tracks:
    name: 追跡・株価更新バッチ
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: DATABASE_URL 確認
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::secrets.DATABASE_URL が未設定です。GitHub Repo → Settings → Secrets → Actions に追加してください。"
            exit 1
          fi
          echo "DATABASE_URL is set (masked)"

      - name: DATABASE_URL 接続テスト
        run: python scripts/test_database_connection.py --skip-write-test

      - name: 追跡・株価更新バッチ実行
        run: python scripts/run_tracking_batch.py --limit 500 --summary
