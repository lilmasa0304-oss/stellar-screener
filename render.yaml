# Render.com Blueprint — STELLAR SCREENER
# https://render.com/docs/blueprint-spec
#
# デプロイ手順:
#   1. GitHub にプッシュ
#   2. Render Dashboard → New → Blueprint → このリポジトリを選択
#   3. Environment タブで DATABASE_URL（Supabase 等）を手動設定
#   4. Deploy
#
# 無料プラン注意:
#   - 15分間アクセスがないとスリープします（UptimeRobot 等での定期 ping 推奨）
#   - 検証リスト等の永続化には外部 DB（Supabase PostgreSQL 無料枠等）の DATABASE_URL が必須です

services:
  - type: web
    name: stellar-screener
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --limit-concurrency 50
    healthCheckPath: /health

    envVars:
      # Python / 文字コード（runtime.txt と併用可）
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUTF8
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"

      # 定時スキャン: Render 本番ではコード側でも無効化。GitHub Actions 運用を推奨
      - key: DISABLE_SCHEDULER
        value: "1"

      # --- 以下は Render UI から手動設定（sync: false）---
      # Supabase: Project Settings → Database → Connection string (URI)
      - key: DATABASE_URL
        sync: false
      - key: DIFY_API_KEY
        sync: false
      - key: DIFY_API_URL
        value: https://api.dify.ai/v1
      - key: DIFY_USER
        value: render_user

      # 銘柄診断の高速化（TTL キャッシュ・短い履歴取得）
      - key: DIAGNOSIS_CACHE_TTL_SEC
        value: "300"
      - key: DIAGNOSIS_HISTORY_DAYS
        value: "120"
      - key: DIAGNOSIS_TIMEOUT_SEC
        value: "28"
