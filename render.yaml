# Render.com Blueprint — STELLAR SCREENER
# https://render.com/docs/blueprint-spec
#
# デプロイ手順:
#   1. GitHub にプッシュ
#   2. Render Dashboard → New → Blueprint → このリポジトリを選択
#      または New → Web Service → GitHub リポジトリを選択（設定は下記参照）
#   3. Environment タブで sync:false の機密変数を手動入力
#   4. Deploy
#
# 無料プラン注意:
#   - 15分間アクセスがないとスリープします（UptimeRobot 等での定期 ping 推奨）
#   - Persistent Disk（本 Blueprint で 1GB）により SQLite / 検証リストは再起動後も保持されます
#   - Disk 利用には Starter プラン以上が必要です

services:
  - type: web
    name: stellar-screener
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --limit-concurrency 50
    healthCheckPath: /health

    # Persistent Disk: 再起動・再デプロイ後も SQLite（検証リスト含む）を保持
    # ※ Render の Persistent Disk は有料プラン（Starter 以上）が必要
    disk:
      name: stellar-screener-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Python / 文字コード（runtime.txt と併用可）
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUTF8
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"

      # SQLite — Persistent Disk 上に配置（再起動・再デプロイ後も検証リストを保持）
      - key: DB_PATH
        value: /var/data/screener.db
      - key: RENDER_DISK_MOUNT
        value: /var/data

      # 定時スキャン: Render 本番ではコード側でも無効化。GitHub Actions 運用を推奨
      - key: DISABLE_SCHEDULER
        value: "1"

      # --- 以下は Render UI から手動設定（sync: false）---
      - key: DIFY_API_KEY
        sync: false
      - key: DIFY_API_URL
        value: https://api.dify.ai/v1
      - key: DIFY_USER
        value: render_user

      # 銘柄診断の高速化（TTL キャッシュ・短い履歴取得）
      - key: DIAGNOSIS_CACHE_TTL_SEC
        value: "300"
      - key: DIAGNOSIS_HISTORY_DAYS
        value: "120"
      - key: DIAGNOSIS_TIMEOUT_SEC
        value: "28"
